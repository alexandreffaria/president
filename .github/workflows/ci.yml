name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Validate decision cards
        # president's own cards in decisions/ (only that folder: examples/ and test fixtures
        # are not checked here). A broken card fails CI.
        run: node bin/president.js validate .
      - name: Test
        run: npm test
        env:
          # The card writer's property test: 1000 generated cards here, 100 locally.
          FC_RUNS: "1000"
      - name: Build
        run: npm run build
