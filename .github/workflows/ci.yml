name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # Windows: president is about to get a Windows tray/autostart helper, so the hub and its
        # tests must work there too.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Validate decision cards
        # president's own cards in decisions/ (only that folder: examples/ and test fixtures
        # are not checked here). A broken card fails CI.
        run: node bin/preside.js validate .
      - name: Test
        if: runner.os != 'Windows'
        run: npm test
        env:
          # The card writer's property test: 1000 generated cards here, 100 locally.
          FC_RUNS: "1000"
      - name: Test (Windows)
        if: runner.os == 'Windows'
        # Card chat isn't ready for Windows yet: its runner spawns `claude` without resolving
        # claude.exe / npm's claude.cmd, and its tests put test/fake-claude.mjs on PATH as a
        # command. Open PRs change those files, so the fix comes after they merge; until then
        # the chat tests don't run here.
        run: npx vitest run --exclude test/chat.test.ts --exclude test/web/chat.test.tsx
        env:
          FC_RUNS: "1000"
      - name: Build
        run: npm run build
